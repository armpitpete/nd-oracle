name: Repair Resource Visual Corpus Helper

on:
  push:
    branches:
      - agent/v2-public-baseline-completion
    paths:
      - .github/workflows/fix-resource-visual-corpus-workflow.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair quoting defect and self-remove
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/resource-visual-corpus-audit.yml')
          lines = p.read_text(encoding='utf-8').splitlines()
          out = []
          replaced = False
          for line in lines:
              if "queue.append(f'| {name_map[rid].replace" in line:
                  indent = line[:len(line) - len(line.lstrip())]
                  out.append(indent + "display_name = name_map[rid].replace('|', '\\\\|')")
                  out.append(indent + "queue.append(f'| {display_name} | `{entry[\"kind\"]}` | `{entry[\"status\"]}` | {url} |')")
                  replaced = True
              else:
                  out.append(line)
          if not replaced:
              raise SystemExit('target quoting line not found')
          p.write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY
          rm .github/workflows/fix-resource-visual-corpus-workflow.yml
          git config user.name "ND Oracle automation"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/resource-visual-corpus-audit.yml .github/workflows/fix-resource-visual-corpus-workflow.yml
          git commit -m "Repair Resource Visual corpus completion helper"
          git push origin HEAD:agent/v2-public-baseline-completion
