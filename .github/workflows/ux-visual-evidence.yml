name: ND Oracle UX visual evidence

on:
  pull_request:
    branches:
      - main
    paths:
      - "site/**"
      - "scripts/build_site.py"
      - "scripts/evidence_public.py"
      - "scripts/discovery_browser.js"
      - "tests/**"
      - "docs/ND_UX_V1_*.md"
      - "docs/ND_UX_V2_*.md"
      - ".github/workflows/ux-visual-evidence.yml"

permissions:
  contents: read

jobs:
  visual-evidence:
    name: visual-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out frozen UX baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 33677f8fbe110c95adeedb9e90dd62c503d8c15c
          path: baseline
          persist-credentials: false

      - name: Check out exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: candidate/requirements-dev.txt

      - name: Install build dependency
        run: python -m pip install --requirement candidate/requirements-dev.txt

      - name: Build baseline and candidate
        run: |
          set -euo pipefail
          (cd baseline && python scripts/build_site.py)
          (cd candidate && python scripts/build_site.py)

      - name: Prepare deterministic visual-only Find state fixtures
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          probes = {
              "find-no-result": "xyzzqvplm norktavex",
              "find-results": "Where can I look for workplace support in Great Britain if disability or a health condition affects my work?",
          }

          for root in (Path("baseline/dist"), Path("candidate/dist")):
              source = (root / "find" / "index.html").read_text(encoding="utf-8")
              for route, query in probes.items():
                  probe = f"""<script>
          window.addEventListener("load", () => {{
            const input = document.getElementById("find-input");
            const button = document.getElementById("find-button");
            input.value = {query!r};
            button.click();
          }});
          </script>"""
                  target = root / route
                  target.mkdir(parents=True, exist_ok=True)
                  (target / "index.html").write_text(source.replace("</body>", probe + "</body>", 1), encoding="utf-8")

              resources = (root / "resources" / "index.html").read_text(encoding="utf-8")
              open_state = resources.replace(
                  '<details class="resource-catalogue">',
                  '<details class="resource-catalogue" open>',
                  1,
              )
              target = root / "resources-open"
              target.mkdir(parents=True, exist_ok=True)
              (target / "index.html").write_text(open_state, encoding="utf-8")

              measure = """<script>
          window.addEventListener("load", () => {
            document.body.dataset.scrollHeight = String(document.documentElement.scrollHeight);
          });
          </script>"""
              target = root / "resources-measure"
              target.mkdir(parents=True, exist_ok=True)
              (target / "index.html").write_text(
                  resources.replace("</body>", measure + "</body>", 1),
                  encoding="utf-8",
              )
          PY

      - name: Capture frozen baseline and exact candidate screenshots
        run: |
          set -euo pipefail
          command -v google-chrome
          mkdir -p ux-evidence/baseline/{desktop,narrow} ux-evidence/candidate/{desktop,narrow}

          python -m http.server 8765 --directory baseline/dist >/tmp/nd-baseline-http.log 2>&1 &
          BASE_PID=$!
          python -m http.server 8766 --directory candidate/dist >/tmp/nd-candidate-http.log 2>&1 &
          CANDIDATE_PID=$!
          trap 'kill "$BASE_PID" "$CANDIDATE_PID" 2>/dev/null || true' EXIT
          sleep 1

          EVIDENCE_DETAIL="$(find candidate/dist/evidence -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | LC_ALL=C sort | head -n1)"
          test -n "$EVIDENCE_DETAIL"

          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=1200 --dump-dom \
            "http://127.0.0.1:8765/find-no-result/" > /tmp/baseline-find-no-result.html
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=1200 --dump-dom \
            "http://127.0.0.1:8766/find-no-result/" > /tmp/candidate-find-no-result.html
          grep -q "No governed answer yet" /tmp/baseline-find-no-result.html
          grep -q "No governed answer yet" /tmp/candidate-find-no-result.html

          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=1200 --dump-dom \
            "http://127.0.0.1:8765/find-results/" > /tmp/baseline-find-results.html
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=1200 --dump-dom \
            "http://127.0.0.1:8766/find-results/" > /tmp/candidate-find-results.html
          grep -q "Governed routes to inspect" /tmp/baseline-find-results.html
          grep -q "Governed routes to inspect" /tmp/candidate-find-results.html
          grep -q 'class="scope-badge"' /tmp/candidate-find-results.html

          grep -q 'class="resource-catalogue"' candidate/dist/resources/index.html
          ! grep -q 'class="resource-catalogue" open' candidate/dist/resources/index.html
          test "$(grep -o 'choice-card choice-card--primary' candidate/dist/resources/index.html | wc -l)" -eq 4
          grep -q 'Describe what you need' candidate/dist/resources/index.html
          grep -q 'Start from a life problem' candidate/dist/resources/index.html
          grep -q 'Check what applies where I live' candidate/dist/resources/index.html
          grep -q 'Browse by kind of resource' candidate/dist/resources/index.html

          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=1200             --window-size=390,844 --dump-dom             "http://127.0.0.1:8765/resources-measure/" > /tmp/baseline-resources-measure.html
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=1200             --window-size=390,844 --dump-dom             "http://127.0.0.1:8766/resources-measure/" > /tmp/candidate-resources-measure.html

          python - <<'PY'
          import re
          from pathlib import Path

          def height(path):
              text = Path(path).read_text(encoding="utf-8")
              match = re.search(r'data-scroll-height="(\d+)"', text)
              if not match:
                  raise SystemExit(f"Missing scroll-height measurement in {path}")
              return int(match.group(1))

          baseline = height("/tmp/baseline-resources-measure.html")
          candidate = height("/tmp/candidate-resources-measure.html")
          print(f"Resources narrow full-page height: baseline={baseline}px candidate={candidate}px")
          if candidate >= baseline:
              raise SystemExit("V2 Resources page did not reduce whole-page height")
          if candidate > baseline * 0.45:
              raise SystemExit(
                  f"V2 Resources page reduction is too small: {candidate}px vs baseline {baseline}px"
              )
          if candidate > 6200:
              raise SystemExit(f"V2 Resources default narrow page exceeds 6200px: {candidate}px")
          Path("ux-evidence/resources-height.txt").write_text(
              f"baseline_narrow_scroll_height={baseline}\n"
              f"candidate_narrow_scroll_height={candidate}\n"
              f"ratio={candidate / baseline:.4f}\n",
              encoding="utf-8",
          )
          PY

          ROUTES=(
            "home|/"
            "find|/find/"
            "find-no-result|/find-no-result/"
            "find-results|/find-results/"
            "questions-index|/questions/"
            "question-workplace-gb|/questions/workplace-support-great-britain/"
            "resources-index|/resources/"
            "resources-open|/resources-open/"
            "resource-goblin-tools|/resources/goblin-tools/"
            "concept-autism|/understand/autism/"
            "evidence-index|/evidence/"
            "evidence-detail|/evidence/$EVIDENCE_DETAIL/"
            "places|/places/"
            "about|/about/"
            "not-found|/404.html"
          )

          capture() {
            local label="$1"
            local port="$2"
            local size="$3"
            local folder="$4"
            local spec name route
            for spec in "${ROUTES[@]}"; do
              name="${spec%%|*}"
              route="${spec#*|}"
              effective_size="$size"
              if [[ "$name" == "find-results" || "$name" == "find-no-result" ]]; then
                if [[ "$folder" == "desktop" ]]; then
                  effective_size="1440,1800"
                else
                  effective_size="390,1800"
                fi
              elif [[ "$name" == "resources-index" ]]; then
                if [[ "$folder" == "desktop" ]]; then
                  effective_size="1440,3200"
                else
                  effective_size="390,6200"
                fi
              elif [[ "$name" == "resources-open" ]]; then
                if [[ "$folder" == "desktop" ]]; then
                  effective_size="1440,2400"
                else
                  effective_size="390,2800"
                fi
              fi
              google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
                --run-all-compositor-stages-before-draw --virtual-time-budget=1200 \
                --window-size="$effective_size" \
                --screenshot="ux-evidence/$label/$folder/$name.png" \
                "http://127.0.0.1:$port$route"
              test -s "ux-evidence/$label/$folder/$name.png"
            done
          }

          capture baseline 8765 1440,1100 desktop
          capture baseline 8765 390,844 narrow
          capture candidate 8766 1440,1100 desktop
          capture candidate 8766 390,844 narrow

          {
            echo "contract=ND-UX-V2-RESOURCES"
            echo "baseline_sha=33677f8fbe110c95adeedb9e90dd62c503d8c15c"
            echo "candidate_sha=${{ github.event.pull_request.head.sha }}"
            echo "evidence_detail=$EVIDENCE_DETAIL"
            echo "desktop=1440x1100"
            echo "narrow=390x844"
            echo "find_state_capture_height=1800"
            echo "resources_default_capture=1440x3200,390x6200"
            echo "resources_open_capture=1440x2400,390x2800"
            echo "baseline_pngs=$(find ux-evidence/baseline -name '*.png' | wc -l)"
            echo "candidate_pngs=$(find ux-evidence/candidate -name '*.png' | wc -l)"
          } > ux-evidence/manifest.txt

          test "$(find ux-evidence/baseline -name '*.png' | wc -l)" -eq 30
          test "$(find ux-evidence/candidate -name '*.png' | wc -l)" -eq 30

      - name: Upload UX evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nd-ux-v2-visual-evidence-${{ github.event.pull_request.head.sha }}
          path: ux-evidence/
          if-no-files-found: error
          retention-days: 30
