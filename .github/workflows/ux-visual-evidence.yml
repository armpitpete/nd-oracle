name: ND Oracle UX visual evidence

on:
  pull_request:
    branches:
      - main
    paths:
      - "site/**"
      - "scripts/build_site.py"
      - "scripts/evidence_public.py"
      - "scripts/discovery_browser.js"\n      - "scripts/run_ux_visual_evidence.sh"
      - "tests/**"
      - "docs/ND_UX_V1_*.md"
      - "docs/ND_UX_V2_*.md"
      - ".github/workflows/ux-visual-evidence.yml"

permissions:
  contents: read

jobs:
  visual-evidence:
    name: visual-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out frozen UX baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: b165ebb88141a2ce4e0f92a1ca5b64537b6aae49
          path: baseline
          persist-credentials: false

      - name: Check out exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: candidate/requirements-dev.txt

      - name: Install build dependency
        run: python -m pip install --requirement candidate/requirements-dev.txt

      - name: Build baseline and candidate
        run: |
          set -euo pipefail
          (cd baseline && python scripts/build_site.py)
          (cd candidate && python scripts/build_site.py)

      - name: Prepare deterministic visual-only Find state fixtures
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          probes = {
              "find-no-result": "xyzzqvplm norktavex",
              "find-results": "Where can I look for workplace support in Great Britain if disability or a health condition affects my work?",
          }

          for root in (Path("baseline/dist"), Path("candidate/dist")):
              source = (root / "find" / "index.html").read_text(encoding="utf-8")
              for route, query in probes.items():
                  probe = f"""<script>
          window.addEventListener("load", () => {{
            const input = document.getElementById("find-input");
            const button = document.getElementById("find-button");
            input.value = {query!r};
            button.click();
          }});
          </script>"""
                  target = root / route
                  target.mkdir(parents=True, exist_ok=True)
                  (target / "index.html").write_text(source.replace("</body>", probe + "</body>", 1), encoding="utf-8")

              resources = (root / "resources" / "index.html").read_text(encoding="utf-8")
              open_state = resources.replace(
                  '<details class="resource-catalogue">',
                  '<details class="resource-catalogue" open>',
                  1,
              )
              catalogue_focus = """<style>
          .site-header,
          .site-footer,
          .page-heading,
          .notice,
          .resource-subnav,
          #resource-list-heading,
          .resource-start,
          .resource-listing-policy,
          .resource-needs,
          .resource-families,
          .resource-complete > :not(.resource-catalogue) {
            display: none !important;
          }
          main { padding-top: 1rem !important; }
          .resource-complete { margin: 0 !important; }
          .resource-catalogue { margin-top: 0 !important; }
          </style>"""
              target = root / "resources-open"
              target.mkdir(parents=True, exist_ok=True)
              (target / "index.html").write_text(
                  open_state.replace("</head>", catalogue_focus + "</head>", 1),
                  encoding="utf-8",
              )

              questions = (root / "questions" / "index.html").read_text(encoding="utf-8")
              question_open = questions.replace(
                  '<details class="question-group"',
                  '<details class="question-group" open',
              )
              question_focus = """<style>
          .site-header,
          .site-footer,
          .page-heading,
          .question-start,
          .question-boundary,
          .question-area-overview,
          .question-complete {
            display: none !important;
          }
          main { padding-top: 1rem !important; }
          .question-cluster-list { gap: 2rem !important; }
          </style>"""
              target = root / "questions-open"
              target.mkdir(parents=True, exist_ok=True)
              (target / "index.html").write_text(
                  question_open.replace("</head>", question_focus + "</head>", 1),
                  encoding="utf-8",
              )

              measure = """<script>
          window.addEventListener("load", () => {
            document.body.dataset.scrollHeight = String(document.documentElement.scrollHeight);
          });
          </script>"""
              target = root / "questions-measure"
              target.mkdir(parents=True, exist_ok=True)
              (target / "index.html").write_text(
                  questions.replace("</body>", measure + "</body>", 1),
                  encoding="utf-8",
              )

              home = (root / "index.html").read_text(encoding="utf-8")
              target = root / "home-measure"
              target.mkdir(parents=True, exist_ok=True)
              (target / "index.html").write_text(
                  home.replace("</body>", measure + "</body>", 1),
                  encoding="utf-8",
              )

              needs = (root / "needs" / "index.html").read_text(encoding="utf-8")
              target = root / "needs-measure"
              target.mkdir(parents=True, exist_ok=True)
              (target / "index.html").write_text(
                  needs.replace("</body>", measure + "</body>", 1),
                  encoding="utf-8",
              )

              needs_complete_open = needs.replace(
                  '<details class="needs-complete-index">',
                  '<details class="needs-complete-index" open>',
                  1,
              )
              needs_complete_focus = """<style>
          .site-header,
          .site-footer,
          .page-heading,
          .notice,
          .needs-overview,
          #needs-other-heading,
          .home-orientation,
          .home-compatibility > :not(.needs-complete-index) {
            display: none !important;
          }
          main { padding-top: 1rem !important; }
          .home-compatibility { margin: 0 !important; padding: 0 !important; border: 0 !important; }
          </style>"""
              target = root / "needs-complete-open"
              target.mkdir(parents=True, exist_ok=True)
              (target / "index.html").write_text(
                  needs_complete_open.replace("</head>", needs_complete_focus + "</head>", 1),
                  encoding="utf-8",
              )

              communication = (root / "needs" / "communication" / "index.html").read_text(encoding="utf-8")
              if '<details class="need-disclosure need-disclosure--questions">' in communication:
                  communication_open = communication.replace(
                      '<details class="need-disclosure need-disclosure--questions">',
                      '<details class="need-disclosure need-disclosure--questions" open>',
                      1,
                  )
              else:
                  communication_open = communication
              target = root / "need-communication-open"
              target.mkdir(parents=True, exist_ok=True)
              (target / "index.html").write_text(communication_open, encoding="utf-8")

              layout_probe = """<script>
          window.addEventListener("load", () => {
            document.body.dataset.layoutScrollWidth = String(document.documentElement.scrollWidth);
            document.body.dataset.layoutClientWidth = String(document.documentElement.clientWidth);
          });
          </script>"""
              target = root / "need-communication-layout"
              target.mkdir(parents=True, exist_ok=True)
              (target / "index.html").write_text(
                  communication.replace("</body>", layout_probe + "</body>", 1),
                  encoding="utf-8",
              )

          # Candidate-only visual fixture: keep the real resource page unchanged,
          # but focus evidence on the exact published recognition image and force
          # synchronous decoding so the screenshot proves pixels, not only layout.
          candidate_root = Path("candidate/dist")
          cover_page = (candidate_root / "resources" / "a-kind-of-spark" / "index.html").read_text(encoding="utf-8")
          if '<figure class="resource-visual"' not in cover_page:
              raise SystemExit("A Kind of Spark recognition visual missing from candidate page")
          cover_focus = """<style>
          .site-header,
          .site-footer,
          .page-heading,
          main > :not(.resource-visual) {
            display: none !important;
          }
          main { padding-top: 1rem !important; }
          .resource-visual { max-width: 24rem !important; margin: 0 !important; }
          .resource-visual img { max-height: none !important; width: 100% !important; height: auto !important; }
          </style>"""
          cover_page = cover_page.replace('decoding="async"', 'decoding="sync"', 1)
          target = candidate_root / "resource-a-kind-of-spark-cover"
          target.mkdir(parents=True, exist_ok=True)
          (target / "index.html").write_text(
              cover_page.replace("</head>", cover_focus + "</head>", 1),
              encoding="utf-8",
          )
          PY

      - name: Capture frozen baseline and exact candidate screenshots
        run: bash candidate/scripts/run_ux_visual_evidence.sh

      - name: Upload UX evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nd-ux-v2-4-visual-evidence-${{ github.event.pull_request.head.sha }}
          path: ux-evidence/
          if-no-files-found: error
          retention-days: 30
