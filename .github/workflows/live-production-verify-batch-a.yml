name: ND Oracle Batch A live production verification

on:
  workflow_dispatch:

permissions:
  contents: read

# Historical read-only production probe. It must never run automatically on a
# candidate PR because accepted production can legitimately lag the candidate.
jobs:
  verify-batch-a-live-production:
    name: Verify Batch A production routes
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependency
        run: python -m pip install --requirement requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q scripts tests

      - name: Validate knowledge objects
        run: python scripts/validate.py

      - name: Run full regression suite
        run: python -m unittest discover -s tests

      - name: Verify five Batch A production routes
        run: python scripts/verify_live_batch_a.py --origin https://ndoracle.org
