name: Evidence Layer v1 maintenance

on:
  push:
    branches:
      - evidence/evidence-layer-v1

permissions:
  contents: write

concurrency:
  group: evidence-layer-v1-maintenance
  cancel-in-progress: true

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out working branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: evidence/evidence-layer-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependency
        run: python -m pip install --requirement requirements-dev.txt

      - name: Prepare Evidence Layer v1 completion patch
        run: PYTHONPATH=. python scripts/_complete_evidence_v1.py

      - name: Apply frozen-boundary repair
        run: PYTHONPATH=. python scripts/_repair_evidence_v1.py

      - name: Align Evidence acceptance label
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_evidence_layer_v1.py')
          text = path.read_text(encoding='utf-8')
          old = '("Finding used here:", "Context:", "Method:", "Evidence limitations")'
          new = '("Finding used here:", "Population/context:", "Method:", "Evidence limitations")'
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif new not in text:
              raise SystemExit('Evidence context acceptance marker not found')
          PY

      - name: Compile Python sources
        run: python -m compileall -q scripts tests

      - name: Validate knowledge objects
        run: python scripts/validate.py

      - name: Audit Evidence coverage
        run: python scripts/evidence_coverage.py --summary --fail-gaps

      - name: Audit Evidence source freshness
        run: python scripts/evidence_source_freshness.py --fail-overdue

      - name: Audit content freshness
        run: python scripts/check_content_freshness.py --fail-overdue

      - name: Run full regression suite
        run: python -m unittest discover -s tests

      - name: Prepare non-workflow product commit
        run: |
          rm scripts/_complete_evidence_v1.py scripts/_repair_evidence_v1.py
          git restore --source=HEAD -- .github/workflows/validate.yml

      - name: Push validated product tree
        run: |
          git config user.name "ND Oracle maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No completion changes produced"; exit 1; }
          git commit -m "ND Oracle: complete Evidence Layer v1 product tree"
          git push origin HEAD:evidence/evidence-layer-v1
