name: Evidence Layer v1 maintenance

on:
  push:
    branches:
      - evidence/evidence-layer-v1

permissions:
  contents: write

concurrency:
  group: evidence-layer-v1-maintenance
  cancel-in-progress: true

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out working branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: evidence/evidence-layer-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependency
        run: python -m pip install --requirement requirements-dev.txt

      - name: Prepare Evidence Layer v1 completion patch
        run: python scripts/_complete_evidence_v1.py

      - name: Compile Python sources
        run: python -m compileall -q scripts tests

      - name: Validate knowledge objects
        run: python scripts/validate.py

      - name: Audit Evidence coverage
        run: python scripts/evidence_coverage.py --summary --fail-gaps

      - name: Audit content freshness
        run: python scripts/check_content_freshness.py --fail-overdue

      - name: Run full regression suite
        run: python -m unittest discover -s tests

      - name: Remove maintenance machinery
        run: rm scripts/_complete_evidence_v1.py .github/workflows/evidence-layer-maintenance.yml

      - name: Commit validated product tree
        run: |
          git config user.name "ND Oracle maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No completion changes produced"; exit 1; }
          git commit -m "ND Oracle: complete Evidence Layer v1"
          git push origin HEAD:evidence/evidence-layer-v1
