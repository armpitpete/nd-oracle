name: TEMP ingest A Kind of Spark cover

on:
  push:
    branches:
      - agent/v2-public-baseline-completion

permissions:
  contents: write

concurrency:
  group: temp-ingest-a-kind-of-spark
  cancel-in-progress: false

jobs:
  ingest:
    if: ${{ !contains(github.event.head_commit.message, '[a-kind-of-spark-ingested]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/v2-public-baseline-completion
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install repository validation dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Fetch exact authorised publisher cover
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/resource-media
          curl --fail-with-body --location --silent --show-error \
            'https://sdmntprnortheu.oaiusercontent.com/files/00000000-4320-81f4-ba29-ddd161017299/raw?se=2026-09-22T12%3A32%3A48Z&sp=r&sv=2026-02-06&sr=b&scid=d6237378-9414-5ec0-acd2-b6db3e095a7f&skoid=8981e47a-681f-4a6a-b86c-73d6347614b7&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-22T08%3A58%3A43Z&ske=2026-09-23T08%3A58%3A43Z&sks=b&skv=2026-02-06&sig=GD/6aM/lhFEtneXiupMGbjMz6X4TrbzifhbD8uCTu68%3D' \
            --output site/resource-media/a-kind-of-spark.jpg
          echo '483dc7fd0daa8bc473b449c298737e943a717a3e544f2bd48650d272f021d7d7  site/resource-media/a-kind-of-spark.jpg' | sha256sum --check -
          test "$(wc -c < site/resource-media/a-kind-of-spark.jpg)" -eq 1478012

      - name: Apply rights and registry reconciliation
        run: python scripts/_temp_ingest_a_kind_of_spark.py

      - name: Run targeted visual-rights tests
        run: |
          python -m compileall -q scripts tests
          python -m unittest tests.test_resource_visual_full_corpus_v1 tests.test_resource_visual_pipeline_v25 tests.test_resource_visual_hierarchy_v25

      - name: Run full regression suite
        run: python -m unittest discover -s tests

      - name: Guard protected boundaries
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only | grep -E '^(objects/|schema/|discovery/|contracts/current-production.json|\.github/workflows/deploy-cloudflare-pages.yml)$'; then
            echo 'Protected content/state path changed unexpectedly.' >&2
            exit 1
          fi
          test "$(git diff -- objects/resources/a-kind-of-spark.json | wc -c)" -eq 0

      - name: Commit bounded ingestion and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/_temp_ingest_a_kind_of_spark.py
          git add docs/RESOURCE_VISUAL_FULL_CORPUS_REGISTER_v1.md \
            docs/RESOURCE_VISUAL_PERMISSION_QUEUE_v1.md \
            docs/RESOURCE_VISUAL_RIGHTS_A_KIND_OF_SPARK_v1.md \
            site/resource-media/a-kind-of-spark.jpg \
            site/resource-visuals.json \
            tests/test_resource_visual_full_corpus_v1.py
          if git diff --cached --name-only | grep -E '^(objects/|schema/|discovery/|contracts/current-production.json|\.github/workflows/deploy-cloudflare-pages.yml)$'; then
            echo 'Protected path staged unexpectedly.' >&2
            exit 1
          fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Ingest authorised A Kind of Spark cover [a-kind-of-spark-ingested]'
          git push origin HEAD:agent/v2-public-baseline-completion
