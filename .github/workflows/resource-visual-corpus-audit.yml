name: Resource Visual Corpus Completion

on:
  push:
    branches:
      - agent/v2-public-baseline-completion
    paths:
      - .github/workflows/resource-visual-corpus-audit.yml

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Expand visual registry to the complete governed Resource corpus
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          root = Path('.')
          resource_paths = sorted((root / 'objects' / 'resources').glob('*.json'))
          resources = [json.loads(path.read_text(encoding='utf-8')) for path in resource_paths]
          if len(resources) != 168:
              raise SystemExit(f'expected 168 Resources, found {len(resources)}')

          registry_path = root / 'site' / 'resource-visuals.json'
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          old_entries = registry['entries']

          useful_categories = {'app', 'book', 'game', 'media'}
          useful_tools = {
              'apple-assistive-access': ['recognise', 'understand'],
              'goblin-tools': ['recognise', 'understand'],
              'microsoft-immersive-reader': ['recognise', 'understand'],
              'time-timer': ['recognise', 'understand'],
          }
          category_reasons = {
              'app': ['recognise', 'distinguish'],
              'book': ['recognise', 'distinguish'],
              'game': ['recognise', 'distinguish'],
              'media': ['recognise', 'distinguish'],
          }

          entries = {}
          for resource in sorted(resources, key=lambda item: item['id']):
              rid = resource['id']
              category = resource['category']
              if rid in old_entries:
                  entry = old_entries[rid]
                  entry['resource_id'] = rid
                  entry['kind'] = category
                  entries[rid] = entry
                  continue

              helpful = category in useful_categories or rid in useful_tools
              locator = next((x.get('value') for x in resource.get('locators', []) if x.get('type') == 'url'), None)
              if helpful:
                  reasons = useful_tools.get(rid, category_reasons.get(category, ['recognise']))
                  entries[rid] = {
                      'resource_id': rid,
                      'kind': category,
                      'status': 'rights-unknown',
                      'materially_helpful': True,
                      'helps': reasons,
                      'usefulness_note': 'A recognisable product/interface visual materially improves recognition or understanding of this resource.',
                      'source_url': locator,
                      'rights_holder': None,
                      'rights_basis': None,
                      'local_path': None,
                      'alt': None,
                      'attribution': None,
                      'attribution_required': False,
                      'checked_on': '2026-09-16',
                      'rights_note': 'Rights review required before any asset may be published.',
                  }
              else:
                  entries[rid] = {
                      'resource_id': rid,
                      'kind': category,
                      'status': 'not-useful',
                      'materially_helpful': False,
                      'helps': [],
                      'usefulness_note': 'The resource is primarily a service, organisation, community route, guidance page or text-led information route; an image would add decoration more than recognition or understanding.',
                      'source_url': locator,
                      'rights_holder': None,
                      'rights_basis': None,
                      'local_path': None,
                      'alt': None,
                      'attribution': None,
                      'attribution_required': False,
                      'checked_on': '2026-09-16',
                      'rights_note': 'No asset pursued because the visual-usefulness gate did not pass.',
                  }

          registry['entries'] = entries
          registry['corpus_contract'] = 'Every governed Resource must have exactly one explicit visual-policy state.'
          registry_path.write_text(json.dumps(registry, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          categories = Counter(item['category'] for item in resources)
          statuses = Counter(entry['status'] for entry in entries.values())
          helpful = [entry for entry in entries.values() if entry['materially_helpful']]
          useful_by_category = Counter(entry['kind'] for entry in helpful)

          lines = [
              '# Resource Visual Full-Corpus Register v1', '',
              '> **Canonical rule:** Render a cleared visual when it materially helps the user recognise, distinguish or understand the resource.', '',
              'This register resolves the visual-policy state of the complete governed Resource corpus. It does not treat absence of permission as permission and it does not require decorative imagery for text-led service or guidance routes.', '',
              '## Corpus result', '',
              f'- Governed Resources reviewed: **{len(resources)}/{len(resources)}**',
              f'- Materially-helpful visual candidates: **{len(helpful)}**',
              f'- Explicit `not-useful` decisions: **{statuses.get("not-useful", 0)}**',
              f'- Cleared publishable third-party visuals: **{statuses.get("cleared", 0)}**',
              f'- Permission required: **{statuses.get("permission-required", 0)}**',
              f'- Rights unknown / research required: **{statuses.get("rights-unknown", 0)}**', '',
              '## Governed category coverage', '',
              '| Category | Resources | Visual candidates |', '|---|---:|---:|'
          ]
          for category in sorted(categories):
              lines.append(f'| `{category}` | {categories[category]} | {useful_by_category.get(category, 0)} |')
          lines.extend(['', '## Usefulness decisions', '',
              '- All books, games, apps and media entries pass the recognition/distinction gate.',
              '- `Time Timer` passes because the physical visual timer itself is central to understanding and recognising the product.',
              '- `Apple Assistive Access`, `Microsoft Immersive Reader` and `Goblin Tools` pass because a controlled interface/product visual can materially improve recognition and understanding.',
              '- Remaining tools, education/work resources, practical guides, services, organisations and community routes are text-led in this corpus and remain deliberately image-free unless future evidence changes the usefulness decision.', '',
              'The machine-readable authority for individual states is `site/resource-visuals.json`.', ''
          ])
          (root / 'docs' / 'RESOURCE_VISUAL_FULL_CORPUS_REGISTER_v1.md').write_text('\n'.join(lines), encoding='utf-8')

          queue = [
              '# Resource Visual Permission Queue v1', '',
              'This queue contains every governed Resource that passes the visual-usefulness gate but is not yet lawfully cleared for publication.', '',
              '| Resource | Type | Status | Official resource surface |', '|---|---|---|---|'
          ]
          name_map = {r['id']: r['name'] for r in resources}
          for rid, entry in entries.items():
              if entry['materially_helpful'] and entry['status'] != 'cleared':
                  url = entry.get('source_url') or 'research required'
                  queue.append(f'| {name_map[rid].replace("|", "\\|")} | `{entry["kind"]}` | `{entry["status"]}` | {url} |')
          queue.extend(['', 'A rights status is not upgraded to `cleared` until an explicit publishable basis and local controlled asset are both recorded.', ''])
          (root / 'docs' / 'RESOURCE_VISUAL_PERMISSION_QUEUE_v1.md').write_text('\n'.join(queue), encoding='utf-8')
          PY

      - name: Strengthen full-corpus validation and tests
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('scripts/resource_visuals.py')
          s = p.read_text(encoding='utf-8')
          old = '''    resource_map = {item["id"]: item for item in resources}\n    for resource_id, entry in entries.items():\n'''
          new = '''    resource_map = {item["id"]: item for item in resources}\n    entry_ids = set(entries)\n    resource_ids = set(resource_map)\n    if entry_ids != resource_ids:\n        missing = sorted(resource_ids - entry_ids)\n        unexpected = sorted(entry_ids - resource_ids)\n        raise ValueError(f"resource visual registry must resolve every governed Resource: missing={missing}; unexpected={unexpected}")\n\n    cleared_paths: dict[str, str] = {}\n    for resource_id, entry in entries.items():\n'''
          if old not in s:
              raise SystemExit('resource_visuals.py coverage anchor not found')
          s = s.replace(old, new, 1)
          old2 = '''            if asset.stat().st_size > MAX_ASSET_BYTES:\n                raise ValueError(f"{resource_id}: visual exceeds {MAX_ASSET_BYTES} bytes")\n        else:\n'''
          new2 = '''            if asset.stat().st_size > MAX_ASSET_BYTES:\n                raise ValueError(f"{resource_id}: visual exceeds {MAX_ASSET_BYTES} bytes")\n            path_key = str(asset)\n            if path_key in cleared_paths:\n                raise ValueError(f"{resource_id}: duplicate cleared visual asset also used by {cleared_paths[path_key]}")\n            cleared_paths[path_key] = resource_id\n            if entry.get("attribution_required") and not entry.get("attribution"):\n                raise ValueError(f"{resource_id}: attribution is required but missing")\n            data = asset.read_bytes()\n            suffix = asset.suffix.casefold()\n            valid_content = (\n                (suffix == ".png" and data.startswith(b"\\x89PNG\\r\\n\\x1a\\n")) or\n                (suffix in {".jpg", ".jpeg"} and data.startswith(b"\\xff\\xd8\\xff")) or\n                (suffix == ".webp" and len(data) >= 12 and data[:4] == b"RIFF" and data[8:12] == b"WEBP") or\n                (suffix == ".svg" and b"<svg" in data[:4096].lower())\n            )\n            if not valid_content:\n                raise ValueError(f"{resource_id}: visual file content does not match a supported image format")\n        else:\n'''
          if old2 not in s:
              raise SystemExit('resource_visuals.py asset-validation anchor not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')

          t = Path('tests/test_resource_visual_pipeline_v25.py')
          x = t.read_text(encoding='utf-8')
          x = x.replace('def test_actual_registry_is_schema_v2_and_p1_only(self) -> None:', 'def test_actual_registry_resolves_full_governed_corpus(self) -> None:')
          old_test = '''        self.assertTrue(registry["entries"])\n        for rid, entry in registry["entries"].items():\n            self.assertIn(resource_map[rid]["category"], {"book", "game", "app", "media"})\n            self.assertTrue(entry["materially_helpful"])\n            self.assertTrue(entry["helps"])\n'''
          new_test = '''        self.assertEqual(set(registry["entries"]), set(resource_map))\n        self.assertEqual(len(registry["entries"]), 168)\n        useful = [entry for entry in registry["entries"].values() if entry["materially_helpful"]]\n        self.assertEqual(len(useful), 37)\n        self.assertEqual(sum(entry["status"] == "not-useful" for entry in registry["entries"].values()), 131)\n        for rid, entry in registry["entries"].items():\n            self.assertEqual(entry["kind"], resource_map[rid]["category"])\n            if entry["materially_helpful"]:\n                self.assertTrue(entry["helps"])\n            else:\n                self.assertEqual(entry["status"], "not-useful")\n                self.assertEqual(entry["helps"], [])\n'''
          if old_test not in x:
              raise SystemExit('pipeline test anchor not found')
          x = x.replace(old_test, new_test, 1)
          t.write_text(x, encoding='utf-8')

          new_test_file = Path('tests/test_resource_visual_full_corpus_v1.py')
          new_test_file.write_text('''from __future__ import annotations\n\nimport json\nimport shutil\nimport tempfile\nimport unittest\nfrom pathlib import Path\n\nfrom scripts import resource_visuals\n\nROOT = Path(__file__).resolve().parents[1]\n\n\nclass ResourceVisualFullCorpusTests(unittest.TestCase):\n    def _resources(self):\n        return [json.loads(p.read_text(encoding="utf-8")) for p in sorted((ROOT / "objects" / "resources").glob("*.json"))]\n\n    def test_every_governed_resource_has_exactly_one_visual_state(self):\n        resources = self._resources()\n        registry = resource_visuals.load_registry()\n        self.assertEqual(len(resources), 168)\n        self.assertEqual(set(registry["entries"]), {r["id"] for r in resources})\n        resource_visuals.validate_registry(registry, resources)\n\n    def test_visual_candidate_scope_is_explicit_and_bounded(self):\n        registry = resource_visuals.load_registry()\n        useful_ids = {rid for rid, e in registry["entries"].items() if e["materially_helpful"]}\n        self.assertEqual(len(useful_ids), 37)\n        for rid, entry in registry["entries"].items():\n            if rid not in useful_ids:\n                self.assertEqual(entry["status"], "not-useful")\n\n    def test_missing_registry_entry_fails_closed(self):\n        resources = self._resources()\n        registry = json.loads(json.dumps(resource_visuals.load_registry()))\n        registry["entries"].pop(next(iter(registry["entries"])))\n        with self.assertRaisesRegex(ValueError, "resolve every governed Resource"):\n            resource_visuals.validate_registry(registry, resources)\n\n    def test_corrupt_cleared_asset_fails_closed(self):\n        with tempfile.TemporaryDirectory() as td:\n            root = Path(td)\n            media = root / "site" / "resource-media"\n            media.mkdir(parents=True)\n            (media / "broken.png").write_bytes(b"not-a-png")\n            resource = {"id": "demo", "category": "book"}\n            entry = {\n                "resource_id": "demo", "kind": "book", "status": "cleared",\n                "materially_helpful": True, "helps": ["recognise"], "usefulness_note": "test",\n                "source_url": "https://example.org", "rights_holder": "test", "rights_basis": "test",\n                "local_path": "site/resource-media/broken.png", "alt": "test", "attribution": None,\n                "attribution_required": False, "checked_on": "2026-09-16", "rights_note": "test"\n            }\n            registry = {"schema_version": "2", "policy": "docs/RESOURCE_VISUAL_ASSET_POLICY_v1.md", "entries": {"demo": entry}}\n            with self.assertRaisesRegex(ValueError, "file content"):\n                resource_visuals.validate_registry(registry, [resource], root=root)\n\n    def test_required_attribution_fails_closed_when_missing(self):\n        with tempfile.TemporaryDirectory() as td:\n            root = Path(td)\n            media = root / "site" / "resource-media"\n            media.mkdir(parents=True)\n            shutil.copy2(ROOT / "tests" / "fixtures" / "resource-visual-cleared.svg", media / "demo.svg")\n            resource = {"id": "demo", "category": "book"}\n            entry = {\n                "resource_id": "demo", "kind": "book", "status": "cleared",\n                "materially_helpful": True, "helps": ["recognise"], "usefulness_note": "test",\n                "source_url": "https://example.org", "rights_holder": "test", "rights_basis": "test",\n                "local_path": "site/resource-media/demo.svg", "alt": "test", "attribution": None,\n                "attribution_required": True, "checked_on": "2026-09-16", "rights_note": "test"\n            }\n            registry = {"schema_version": "2", "policy": "docs/RESOURCE_VISUAL_ASSET_POLICY_v1.md", "entries": {"demo": entry}}\n            with self.assertRaisesRegex(ValueError, "attribution is required"):\n                resource_visuals.validate_registry(registry, [resource], root=root)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run complete regression suite
        run: python -m pytest -q
      - name: Guard governed/protected paths
        run: |
          test -z "$(git diff --name-only HEAD -- objects schema discovery || true)"
          test -z "$(git diff --name-only HEAD -- .github/workflows/deploy.yml site/CURRENT_PRODUCTION || true)"
      - name: Commit bounded full-corpus visual work and remove temporary workflow
        run: |
          rm .github/workflows/resource-visual-corpus-audit.yml
          git config user.name "ND Oracle automation"
          git config user.email "actions@users.noreply.github.com"
          git add site/resource-visuals.json scripts/resource_visuals.py tests/test_resource_visual_pipeline_v25.py tests/test_resource_visual_full_corpus_v1.py docs/RESOURCE_VISUAL_FULL_CORPUS_REGISTER_v1.md docs/RESOURCE_VISUAL_PERMISSION_QUEUE_v1.md .github/workflows/resource-visual-corpus-audit.yml
          git commit -m "Complete full-corpus Resource visual registry"
          git push origin HEAD:agent/v2-public-baseline-completion
