name: Wire UK breadth candidate

on:
  push:
    branches: [coverage/uk-breadth-v1]
    paths:
      - .github/workflows/uk-breadth-wire.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coverage/uk-breadth-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch current builder and coverage map
        shell: python
        run: |
          from pathlib import Path

          groups = [
              ('Daily life & technology', ['task-starting-and-organisation', 'make-device-easier-to-use', 'meal-planning-and-everyday-food-tasks', 'household-tasks-chore-overload', 'appointments-admin-preparation', 'transitions-change-between-tasks']),
              ('Sensory & environment', ['make-noisy-bright-place-easier', 'sensory-overload-what-can-i-change', 'clothing-touch-sensory-discomfort', 'temperature-smell-taste-sensory-environment', 'travel-sensory-overload-preparation']),
              ('Communication', ['aac-and-nonspeaking-communication', 'phone-calls-are-difficult', 'processing-time-in-conversations-meetings', 'written-vs-spoken-communication-preference', 'ask-service-email-text-instead-phone', 'mixed-neurotype-communication-misunderstandings']),
              ('Work', ['workplace-support-great-britain', 'reasonable-adjustments-at-work-great-britain', 'disabled-person-looking-for-work-uk', 'disclosing-disability-neurodivergence-at-work', 'job-interview-adjustments-great-britain', 'staying-in-work-performance-process-adjustments', 'occupational-health-neurodivergent-what-to-expect', 'self-employed-disabled-work-support']),
              ('Education & study', ['disabled-student-support-england', 'disabled-student-support-scotland', 'disabled-student-support-wales', 'disabled-student-support-northern-ireland', 'organising-study-and-assignments', 'send-support-school-college-england', 'exams-assessment-adjustments-study', 'note-taking-and-lecture-access', 'school-college-transition-support-uk']),
              ('Assessment & diagnosis', ['adult-adhd-assessment-england', 'adult-autism-assessment-england', 'adult-adhd-assessment-scotland', 'adult-autism-assessment-scotland', 'adult-adhd-assessment-wales', 'adult-autism-assessment-wales', 'adult-adhd-assessment-northern-ireland', 'adult-autism-assessment-northern-ireland', 'child-adhd-assessment-england', 'child-autism-assessment-england', 'child-adhd-assessment-scotland', 'child-autism-assessment-scotland', 'child-adhd-assessment-wales', 'child-autism-assessment-wales', 'child-adhd-assessment-northern-ireland', 'child-autism-assessment-northern-ireland', 'private-autism-adhd-assessment-uk', 'waiting-for-autism-adhd-assessment-uk', 'assessment-refused-or-disagree-uk', 'after-autism-adhd-assessment-uk', 'assessment-communication-sensory-adjustments-uk', 'co-occurring-autism-adhd-assessment-uk', 'other-neurodevelopmental-assessments-uk']),
              ('Health & wellbeing', ['autism-anxiety-tools', 'masking-exhaustion-and-autistic-burnout', 'sleep-and-winding-down-routines', 'healthcare-communication-adjustments-england', 'healthcare-communication-adjustments-scotland', 'healthcare-communication-adjustments-wales', 'healthcare-communication-adjustments-northern-ireland']),
              ('Relationships & family', ['autistic-parent-support-uk', 'communication-needs-in-relationships', 'neurodivergent-parent-overwhelmed-by-admin', 'friendship-misunderstandings-neurodivergent', 'partner-communication-processing-sensory-needs', 'boundaries-neurodivergent-relationships', 'conflict-repair-processing-time-relationships', 'intimacy-consent-sensory-communication', 'parenting-neurodivergent-child-uk', 'disabled-neurodivergent-parent-service-access-uk', 'family-events-sensory-social-load', 'relationship-safety-domestic-abuse-help', 'should-i-leave-or-stay-relationship-boundary']),
              ('Money & administration', ['disability-benefits-where-start-uk', 'budgeting-when-numbers-paperwork-hard', 'debt-missed-payments-where-start', 'benefit-decision-disagree-which-process-uk', 'forms-official-paperwork-overwhelming', 'letters-bills-correspondence-pile-up', 'deadlines-renewals-appeals-remembering', 'get-help-with-money-admin-without-financial-advice']),
              ('Food & eating', ['sensory-food-texture-smell-eating', 'restricted-food-range-when-seek-help', 'arfid-information-without-self-diagnosis', 'cooking-meal-preparation-executive-function']),
              ('Sleep', ['sleep-environment-sensory-load', 'shift-work-sleep-routine', 'persistent-insomnia-when-seek-help', 'sleep-medication-melatonin-boundary']),
              ('Mental wellbeing', ['urgent-mental-health-help-uk', 'low-mood-depression-where-start', 'trauma-distress-ptsd-assessment-boundary', 'talking-therapy-access-and-adjustments', 'mental-health-appointments-communication-sensory-adjustments']),
              ('Healthcare access', ['hospital-appointment-reasonable-adjustments', 'dental-appointment-sensory-anxiety-adjustments', 'medication-information-without-changing-dose']),
              ('Mobility & travel', ['adhd-driving-dvla-great-britain', 'disabled-travel-support-scotland', 'disabled-travel-support-wales', 'disabled-travel-support-northern-ireland', 'public-transport-assistance-disabled-uk', 'coordination-mobility-travel-planning']),
              ('Technology & accessibility', ['operating-system-accessibility-settings', 'speech-to-text-and-voice-control', 'reduce-digital-distraction-and-motion']),
              ('Organisations & peer community', ['find-local-neurodivergent-peer-group', 'online-peer-community-safety-fit', 'parent-carer-peer-support-uk']),
              ('Books & media', ['lived-experience-books-not-clinical-evidence', 'children-young-people-neurodivergent-fiction', 'choosing-neurodiversity-book-media']),
              ('Information & support', ['autism-information-and-support', 'dyslexia-information-and-support-uk', 'tourette-information-and-support-uk', 'learning-disability-information-and-support-uk', 'dld-information-and-support', 'adult-dyspraxia-information-uk', 'dyscalculia-information-and-support-uk']),
              ('Games & downtime', ['low-time-pressure-games', 'low-reaction-demand-games', 'easy-to-interrupt-games', 'configurable-game-pressure', 'simple-control-games', 'low-consequence-games', 'solo-low-social-pressure-games', 'building-sorting-collecting-games', 'gaming-community-social-load', 'low-sensory-demand-games', 'checking-game-accessibility-before-buying', 'adult-autistic-gaming-communities']),
          ]
          flat = [item for _group, ids in groups for item in ids]
          assert len(flat) == 135, len(flat)
          assert len(flat) == len(set(flat))

          path = Path('scripts/build_site.py')
          text = path.read_text(encoding='utf-8')
          assert 'V10_ROUTE_COUNT = 292' in text
          text = text.replace('V10_ROUTE_COUNT = 292', 'V10_ROUTE_COUNT = 367', 1)
          start = text.index('QUESTION_GROUPS = [', text.index('# ---- current v1.0 builder ----'))
          end = text.index('\n_compat09__QUESTION_GROUPS = QUESTION_GROUPS', start)
          text = text[:start] + 'QUESTION_GROUPS = ' + repr(groups) + text[end:]
          path.write_text(text, encoding='utf-8')

          gap = Path('docs/CONTENT_GAP_MAP_v1.4.md')
          g = gap.read_text(encoding='utf-8')
          g = g.replace('- 99 reviewed Resources\n- 86 reviewed practical Questions\n- 3 governed Evidence objects\n- 208 governed objects total\n- 292 canonical public routes in the current candidate build contract', '- 125 reviewed Resources\n- 135 reviewed practical Questions\n- 3 governed Evidence objects\n- 283 governed objects total\n- 367 canonical public routes in the current candidate build contract')
          old_prod = 'Accepted production remains the separately recorded 2026-09-03 deployment with 190 governed objects and 274 canonical routes until a newer exact SHA is deployed and live-verified. Production identity is resolved through `contracts/current-production.json` and recorded in `docs/PRODUCTION_STATE_2026-09-03.md`. Earlier versioned production-state documents remain immutable historical evidence.'
          new_prod = 'Accepted production is the separately recorded 2026-09-03 Relationships & family deployment with 208 governed objects and 292 canonical routes. Production identity is resolved through `contracts/current-production.json` and recorded in `docs/PRODUCTION_STATE_2026-09-03_RELATIONSHIPS_FAMILY.md`. This UK-breadth repository candidate is not production unless and until a protected exact-SHA deployment and fresh live verification are completed; earlier production-state documents remain immutable historical evidence.'
          assert old_prod in g
          g = g.replace(old_prod, new_prod, 1)
          replacements = {
              '| Daily living | Strong seed | shopping, household work, appointments, correspondence, transitions, more paperwork/admin routes |': '| Daily living | **Strong** | broader household-support services, supported admin and independent evidence on practical task adaptations |',
              '| Sensory needs | Strong seed | clothing, temperature, smell/taste, travel environments, more person-controlled accommodations |': '| Sensory needs | **Strong** | stronger comparative accommodation evidence, workplace/school uniform depth and broader travel implementation data |',
              '| Communication | Strong seed | broader AAC systems and service contexts, conflict evidence depth, mixed-neurotype communication research |': '| Communication | **Strong** | broader AAC systems, cross-service alternative-contact implementation and stronger mixed-neurotype communication evidence |',
              '| Work | Strong | staying in work, performance processes, occupational health, self-employment, Northern Ireland employment routes |': '| Work | **Strong reference seed** | stronger occupational-health first-party guidance, Northern Ireland process depth and employment-retention evidence |',
              '| Education & study | Strong | exams, note-taking, school transitions, further education and broader four-nation school routes |': '| Education & study | **Strong reference seed** | official exam-adjustment depth, England transition-specific evidence, FE breadth and implementation quality across four nations |',
              '| Money & administration | Thin | budgeting, debt, forms, correspondence, deadlines, appeals and advocacy |': '| Money & administration | **Strong bounded seed** | accessible advocacy, council-tax/local-welfare routes, banking/scam safety, nation-specific debt depth and supported form completion |',
              '| Sleep | Emerging | environment, shift work, clinical routes and stronger evidence coverage |': '| Sleep | **Strong bounded seed** | sleep-clinic navigation, children, circadian/shift-work evidence, medication evidence and broader four-nation clinical pathways |',
              '| Food & eating | Emerging | sensory eating, restricted diets, ARFID boundary, nutrition access and cooking supports |': '| Food & eating | **Strong bounded seed** | dietetic access, children, pica/swallowing boundaries, broader ARFID pathways and stronger cooking-support evidence |',
              '| Healthcare access | Strong seed | hospital-specific routes, dentistry, medication-navigation and broader service implementation evidence |': '| Healthcare access | **Strong** | dentistry-specific national sources, medication-review routes, hospital implementation evidence and four-nation adjustment-recording depth |',
              '| Mental wellbeing | Partial | crisis/support boundaries, depression, trauma, therapy access and neurodivergent adaptations |': '| Mental wellbeing | **Strong safety-gated seed** | Wales/NI therapy navigation, crisis non-voice accessibility, adaptation outcomes and broader condition/service coverage |',
              '| Mobility & travel | Good seed | England travel-support parity, public transport/navigation and coordination-related mobility |': '| Mobility & travel | **Strong seed** | Northern Ireland rail-assistance depth, bus/coach accessibility, operator-level cognitive/sensory metadata and journey-planning evidence |',
              '| Technology & accessibility | Strong seed | browser/OS breadth, speech-to-text breadth, distraction reduction and setup guidance |': '| Technology & accessibility | **Strong** | browser-specific depth, independent comparative usability evidence, privacy/offline speech-tool comparison and setup walkthroughs |',
              '| Books & media | Partial | wider authorship, children’s books, research-informed introductions, media/podcasts |': '| Books & media | **Good bounded seed** | wider authorship, podcasts/documentaries, accessible formats and research-informed introductory material |',
              '| Organisations & peer community | Partial | local/community routes, more condition-specific peer-led groups and geographic breadth |': '| Organisations & peer community | **Good bounded seed** | cross-neurodivergent local directories, geographic breadth, comparable accessibility/moderation metadata and more peer-led groups |',
          }
          for old, new in replacements.items():
              assert old in g, old
              g = g.replace(old, new, 1)
          gap.write_text(g, encoding='utf-8')
      - name: Commit wired candidate
        run: |
          git config user.name "ND Oracle automation"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/build_site.py docs/CONTENT_GAP_MAP_v1.4.md
          git diff --cached --quiet && exit 0
          git commit -m "build: wire UK breadth navigation and state"
          git push origin HEAD:coverage/uk-breadth-v1
