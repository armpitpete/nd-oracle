name: ND Oracle validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          persist-credentials: true

      - name: Apply bounded candidate integration repair
        if: github.event_name == 'pull_request' && github.head_ref == 'coverage/relationships-family-uk-v1'
        run: |
          python scripts/relationships_family_integrate.py
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md scripts/build_site.py objects/questions benchmarks/relationships-family-uk-v1.json tests/test_release_state_integrity.py tests/test_v12_healthcare_parity.py tests/test_v12_need_coverage.py
            git commit -m "fix: integrate Relationships family candidate with frozen contracts"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependency
        run: python -m pip install --requirement requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q scripts tests

      - name: Validate knowledge objects
        run: python scripts/validate.py

      - name: Audit Evidence coverage
        run: python scripts/evidence_coverage.py --summary --fail-gaps

      - name: Audit Evidence source freshness
        run: python scripts/evidence_source_freshness.py --fail-overdue

      - name: Audit content freshness
        run: python scripts/check_content_freshness.py --fail-overdue

      - name: Run regression tests
        run: python -m unittest discover -s tests
