name: ND Oracle validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependency
        run: python -m pip install --requirement requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q scripts tests

      - name: Validate knowledge objects
        run: python scripts/validate.py

      - name: Audit Evidence coverage
        run: python scripts/evidence_coverage.py --summary --fail-gaps

      - name: Audit Evidence source freshness
        run: python scripts/evidence_source_freshness.py --fail-overdue

      - name: Audit content freshness
        run: python scripts/check_content_freshness.py --fail-overdue

      - name: Run regression tests
        run: python -m unittest discover -s tests
