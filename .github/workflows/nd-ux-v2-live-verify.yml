name: ND-UX-V2.1 live production verification

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/nd-ux-v2-live-verify.yml"

permissions:
  contents: read

jobs:
  live-v2:
    name: Read-only live V2.1 verification
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Fetch and verify live V2.1
        shell: bash
        run: |
          set -euo pipefail

          ORIGIN="https://ndoracle.org"
          mkdir -p live-snapshot live-evidence/{desktop,narrow}

          fetch() {
            local path="$1"
            local out="$2"
            mkdir -p "$(dirname "$out")"
            curl --fail-with-body --silent --show-error --location               --retry 3 --retry-delay 2               -H "Cache-Control: no-cache"               -H "Pragma: no-cache"               "$ORIGIN$path" > "$out"
          }

          # Wait briefly for Cloudflare edge propagation of the just-deployed V2.1 marker.
          for attempt in $(seq 1 12); do
            fetch "/resources/" /tmp/resources-live.html
            if grep -q "Choose how to start" /tmp/resources-live.html; then
              break
            fi
            if [[ "$attempt" -eq 12 ]]; then
              echo "Live production never exposed the V2.1 Resources marker." >&2
              exit 1
            fi
            sleep 5
          done

          fetch "/" live-snapshot/index.html
          fetch "/resources/" live-snapshot/resources/index.html
          fetch "/find/" live-snapshot/find/index.html
          fetch "/questions/workplace-support-great-britain/" live-snapshot/questions/workplace-support-great-britain/index.html
          fetch "/resources/goblin-tools/" live-snapshot/resources/goblin-tools/index.html
          fetch "/needs/education-study/" live-snapshot/needs/education-study/index.html
          fetch "/needs/communication/" live-snapshot/needs/communication/index.html
          fetch "/places/" live-snapshot/places/index.html
          fetch "/a-z/" live-snapshot/a-z/index.html
          fetch "/styles.css" live-snapshot/styles.css
          fetch "/find.js" live-snapshot/find.js

          python - <<'PY'
          from __future__ import annotations
          from pathlib import Path
          import json
          import re

          root = Path("live-snapshot")
          resources = (root / "resources/index.html").read_text(encoding="utf-8")
          education = (root / "needs/education-study/index.html").read_text(encoding="utf-8")
          communication = (root / "needs/communication/index.html").read_text(encoding="utf-8")
          places = (root / "places/index.html").read_text(encoding="utf-8")
          home = (root / "index.html").read_text(encoding="utf-8")
          find = (root / "find/index.html").read_text(encoding="utf-8")
          question = (root / "questions/workplace-support-great-britain/index.html").read_text(encoding="utf-8")
          resource = (root / "resources/goblin-tools/index.html").read_text(encoding="utf-8")
          css = (root / "styles.css").read_text(encoding="utf-8")

          required_resources = (
              "Choose how to start",
              "Describe what you need",
              "Start from a life problem",
              "Check what applies where I live",
              "Browse by kind of resource",
              "Browse by area of life",
              "Need the complete catalogue?",
              "Open the complete A–Z index",
              "Show all 168 resources A–Z on this page",
              '<details class="resource-catalogue">',
          )
          for marker in required_resources:
              if marker not in resources:
                  raise SystemExit(f"/resources/: missing V2.1 marker {marker!r}")

          if '<details class="resource-catalogue" open' in resources:
              raise SystemExit("/resources/: complete catalogue unexpectedly expanded by default")
          if resources.count("choice-card choice-card--primary") != 4:
              raise SystemExit("/resources/: expected exactly four primary starting choices")
          details_start = resources.index('<details class="resource-catalogue">')
          resource_count = resources[details_start:].count('<article class="resource-row">')
          if resource_count != 168:
              raise SystemExit(f"/resources/: expected 168 resources in disclosure, found {resource_count}")
          if 'class="resource-alpha-group"' not in resources[details_start:]:
              raise SystemExit("/resources/: expanded catalogue lacks alphabetic landmarks")

          # Five V2.1 task journeys.
          if 'href="/needs/education-study/"' not in resources:
              raise SystemExit("Task 1: Education & study is not directly reachable from Resources")
          if 'href="/questions/organising-study-and-assignments/"' not in education:
              raise SystemExit("Task 1: study organisation question missing from Education & study")

          if 'href="/places/"' not in resources or "<h2>Wales</h2>" not in places:
              raise SystemExit("Task 2: Wales geographic route is not available")

          if 'href="/needs/communication/"' not in resources:
              raise SystemExit("Task 3: Communication is not directly reachable from Resources")
          if 'href="/questions/phone-calls-are-difficult/"' not in communication:
              raise SystemExit("Task 3: phone-calls question missing from Communication")

          if 'href="/a-z/"' not in resources:
              raise SystemExit("Task 5: complete A-Z index is not reachable")

          # Representative global surfaces preserve V2 shared presentation.
          for label, page in (
              ("home", home),
              ("find", find),
              ("question", question),
              ("resource", resource),
          ):
              if "Neurodiversity information, resources and evidence" not in page:
                  raise SystemExit(f"{label}: V2 site-purpose marker missing")
              primary = re.search(r'<nav class="primary-nav" aria-label="Primary">(.*?)</nav>', page, re.S)
              if not primary or primary.group(1).count("<a ") != 4:
                  raise SystemExit(f"{label}: primary navigation is not bounded to four choices")

          for marker in (
              ".choice-card",
              ".resource-catalogue",
              ".resource-alpha-group > h3",
              "@media (forced-colors: active)",
              "@media (prefers-reduced-motion: no-preference)",
          ):
              if marker not in css:
                  raise SystemExit(f"/styles.css: missing V2/accessibility marker {marker!r}")

          # Make a faithful local snapshot for browser checks. It uses HTML, CSS and JS
          # fetched from live production in this run.
          measure = """<script>
          window.addEventListener("load", () => {
            document.body.dataset.scrollWidth = String(document.documentElement.scrollWidth);
            document.body.dataset.clientWidth = String(document.documentElement.clientWidth);
            document.body.dataset.scrollHeight = String(document.documentElement.scrollHeight);
          });
          </script>"""

          for path in (
              root / "index.html",
              root / "resources/index.html",
              root / "find/index.html",
              root / "questions/workplace-support-great-britain/index.html",
              root / "resources/goblin-tools/index.html",
          ):
              text = path.read_text(encoding="utf-8")
              path.write_text(text.replace("</body>", measure + "</body>", 1), encoding="utf-8")

          # Dynamic Find task: use the exact live Find HTML + live find.js.
          find_text = (root / "find/index.html").read_text(encoding="utf-8")
          query_probe = """<script>
          window.addEventListener("load", () => {
            const input = document.getElementById("find-input");
            const button = document.getElementById("find-button");
            input.value = "I want a game with little or no time pressure";
            button.click();
          });
          </script>"""
          target = root / "find-task"
          target.mkdir(parents=True, exist_ok=True)
          (target / "index.html").write_text(
              find_text.replace("</body>", query_probe + "</body>", 1),
              encoding="utf-8",
          )

          # Expanded catalogue evidence: exact live Resources HTML with only the
          # native disclosure opened. A visual-only style hides content above it so
          # screenshots actually show the A-Z structure.
          open_resources = resources.replace(
              '<details class="resource-catalogue">',
              '<details class="resource-catalogue" open>',
              1,
          )
          focus_style = """<style>
          .site-header,
          .site-footer,
          .page-heading,
          .resource-start,
          .resource-boundary,
          .resource-needs,
          .resource-families,
          .resource-complete > :not(.resource-catalogue) {
            display: none !important;
          }
          main { padding-top: 1rem !important; }
          .resource-complete { margin: 0 !important; }
          .resource-catalogue { margin-top: 0 !important; }
          </style>"""
          target = root / "resources-open"
          target.mkdir(parents=True, exist_ok=True)
          (target / "index.html").write_text(
              open_resources.replace("</head>", focus_style + "</head>", 1),
              encoding="utf-8",
          )

          manifest = {
              "contract": "ND-UX-V2.1-LIVE",
              "deployed_main_sha": "70692634e052cf4bdbdd29073d323f132f7e1624",
              "origin": "https://ndoracle.org",
              "resource_count": resource_count,
              "primary_choices": 4,
              "desktop": "1440",
              "narrow": "390",
          }
          Path("live-evidence/manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("PASS static live V2.1 markers and task routes")
          PY

          python -m http.server 8765 --directory live-snapshot >/tmp/nd-v2-live-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1

          command -v google-chrome

          google-chrome --headless=new --no-sandbox --disable-gpu             --virtual-time-budget=1500 --window-size=390,844 --dump-dom             "http://127.0.0.1:8765/find-task/" > /tmp/find-task.html
          grep -q 'href="/questions/low-time-pressure-games/"' /tmp/find-task.html
          echo "PASS task 4: ordinary-language Find reaches low-time-pressure-games"

          python - <<'PY'
          import re
          import subprocess

          routes = (
              "/",
              "/resources/",
              "/find/",
              "/questions/workplace-support-great-britain/",
              "/resources/goblin-tools/",
          )
          for width, height, label in ((390, 844, "narrow"), (1440, 1100, "desktop")):
              for route in routes:
                  html = subprocess.check_output(
                      [
                          "google-chrome", "--headless=new", "--no-sandbox", "--disable-gpu",
                          "--virtual-time-budget=1200", f"--window-size={width},{height}", "--dump-dom",
                          f"http://127.0.0.1:8765{route}",
                      ],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  )
                  sw = re.search(r'data-scroll-width="(\d+)"', html)
                  cw = re.search(r'data-client-width="(\d+)"', html)
                  if not sw or not cw:
                      raise SystemExit(f"{label} {route}: layout metrics missing")
                  if int(sw.group(1)) > int(cw.group(1)) + 1:
                      raise SystemExit(
                          f"{label} {route}: horizontal overflow {sw.group(1)} > {cw.group(1)}"
                      )
                  print(f"PASS {label} no-overflow {route}")
          PY

          capture() {
            local folder="$1"
            local width="$2"
            local height="$3"
            local name="$4"
            local route="$5"
            google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars               --run-all-compositor-stages-before-draw --virtual-time-budget=1500               --window-size="$width,$height"               --screenshot="live-evidence/$folder/$name.png"               "http://127.0.0.1:8765$route"
            test -s "live-evidence/$folder/$name.png"
          }

          for spec in             "home|/"             "resources|/resources/"             "find|/find/"             "question-workplace-gb|/questions/workplace-support-great-britain/"             "resource-goblin-tools|/resources/goblin-tools/"             "resources-open|/resources-open/"
          do
            name="${spec%%|*}"
            route="${spec#*|}"
            if [[ "$name" == "resources" ]]; then
              capture desktop 1440 3200 "$name" "$route"
              capture narrow 390 5000 "$name" "$route"
            elif [[ "$name" == "resources-open" ]]; then
              capture desktop 1440 2400 "$name" "$route"
              capture narrow 390 2800 "$name" "$route"
            else
              capture desktop 1440 1100 "$name" "$route"
              capture narrow 390 844 "$name" "$route"
            fi
          done

          test "$(find live-evidence/desktop -name '*.png' | wc -l)" -eq 6
          test "$(find live-evidence/narrow -name '*.png' | wc -l)" -eq 6

      - name: Upload live V2.1 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nd-ux-v2-1-live-production-evidence
          path: live-evidence/
          if-no-files-found: error
          retention-days: 30
