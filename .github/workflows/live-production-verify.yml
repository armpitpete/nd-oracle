name: ND Oracle live production verification

on:
  workflow_dispatch:

permissions:
  contents: read

# Read-only production observation. Candidate verifier behaviour is covered by
# the normal regression suite; the real production probe is intentionally
# manual/post-deployment so a pre-deploy PR is not required to match its own
# not-yet-published contract.
jobs:
  verify-live-production:
    name: Verify production HTTP contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependency
        run: python -m pip install --requirement requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q scripts tests

      - name: Validate knowledge objects
        run: python scripts/validate.py

      - name: Run full regression suite
        run: python -m unittest discover -s tests

      - name: Verify live production contract
        run: python scripts/verify_live_site.py --origin https://ndoracle.org
