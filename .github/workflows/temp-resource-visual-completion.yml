name: TEMP resource visual completion

on:
  push:
    branches:
      - agent/v2-public-baseline-completion

permissions:
  contents: write

concurrency:
  group: temp-resource-visual-completion
  cancel-in-progress: false

jobs:
  complete:
    if: ${{ !contains(github.event.head_commit.message, '[resource-visual-completion]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/v2-public-baseline-completion
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Apply bounded resource visual completion
        run: python scripts/_temp_complete_resource_visuals_v1.py

      - name: Compile and run targeted resource visual tests
        run: |
          python -m compileall -q scripts tests
          python -m unittest tests.test_resource_visual_pipeline_v25 tests.test_resource_visual_hierarchy_v25

      - name: Run full regression suite
        run: python -m unittest discover -s tests

      - name: Guard protected content boundaries
        run: |
          if git diff --name-only | grep -E '^(objects/|schema/|discovery/|contracts/current-production.json|\.github/workflows/deploy-cloudflare-pages.yml)$'; then
            echo 'Protected content/state path changed unexpectedly.' >&2
            exit 1
          fi

      - name: Remove temporary writer and commit exact result
        run: |
          git rm .github/workflows/temp-resource-visual-completion.yml scripts/_temp_complete_resource_visuals_v1.py
          git add scripts/build_site.py scripts/resource_visuals.py site/resource-visuals.json docs/RESOURCE_VISUAL_ASSET_POLICY_v1.md docs/RESOURCE_VISUAL_INVENTORY_v1.md docs/ND_UX_V2_5_DESIGN_SYSTEM.md docs/V2_PUBLIC_BASELINE_COMPLETION.md tests/test_resource_visual_hierarchy_v25.py tests/test_resource_visual_pipeline_v25.py tests/fixtures/resource-visual-cleared.svg
          if git diff --cached --name-only | grep -E '^(objects/|schema/|discovery/|contracts/current-production.json|\.github/workflows/deploy-cloudflare-pages.yml)$'; then
            echo 'Protected path staged unexpectedly.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete resource visual publication contract [resource-visual-completion]'
          git push origin HEAD:agent/v2-public-baseline-completion
