name: Assessment candidate repair one-shot
on:
  push:
    branches:
      - coverage/assessment-diagnosis-uk-v1
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: coverage/assessment-diagnosis-uk-v1
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Repair candidate and remove helper
        run: python scripts/_repair_assessment_candidate_once.py
      - name: Commit repaired candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Repair UK assessment candidate regressions'
          git push origin HEAD:coverage/assessment-diagnosis-uk-v1
