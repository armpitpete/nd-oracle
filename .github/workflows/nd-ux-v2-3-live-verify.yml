name: ND-UX-V2.3 live production verification

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/nd-ux-v2-3-live-verify.yml"

permissions:
  contents: read

jobs:
  live-v2-3:
    name: Read-only live V2.3 verification
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Fetch and verify live V2.3
        shell: bash
        run: |
          set -euo pipefail

          ORIGIN="https://ndoracle.org"
          mkdir -p live-snapshot live-evidence/{desktop,narrow}

          fetch() {
            local path="$1"
            local out="$2"
            mkdir -p "$(dirname "$out")"
            curl --fail-with-body --silent --show-error --location               --retry 3 --retry-delay 2               -H "Cache-Control: no-cache"               -H "Pragma: no-cache"               "$ORIGIN$path" > "$out"
          }

          for attempt in $(seq 1 12); do
            fetch "/" /tmp/home-live.html
            if grep -q "What do you need right now?" /tmp/home-live.html; then
              break
            fi
            if [[ "$attempt" -eq 12 ]]; then
              echo "Live production never exposed the V2.3 Home marker." >&2
              exit 1
            fi
            sleep 5
          done

          fetch "/" live-snapshot/index.html
          fetch "/needs/" live-snapshot/needs/index.html
          fetch "/needs/communication/" live-snapshot/needs/communication/index.html
          fetch "/needs/health-wellbeing/" live-snapshot/needs/health-wellbeing/index.html
          fetch "/needs/education-study/" live-snapshot/needs/education-study/index.html
          fetch "/needs/work/" live-snapshot/needs/work/index.html
          fetch "/needs/assessment-diagnosis/" live-snapshot/needs/assessment-diagnosis/index.html
          fetch "/needs/sensory-environment/" live-snapshot/needs/sensory-environment/index.html
          fetch "/needs/relationships-family/" live-snapshot/needs/relationships-family/index.html
          fetch "/styles.css" live-snapshot/styles.css

          python - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path("live-snapshot")
          home = (root / "index.html").read_text(encoding="utf-8")
          needs = (root / "needs/index.html").read_text(encoding="utf-8")
          communication = (root / "needs/communication/index.html").read_text(encoding="utf-8")
          health = (root / "needs/health-wellbeing/index.html").read_text(encoding="utf-8")
          css = (root / "styles.css").read_text(encoding="utf-8")

          for marker in (
              "What do you need right now?",
              "Describe what is happening",
              "I know what I need help with",
              "I want something practical",
              "I want to understand something",
              "Or start with an area of life",
              "Need another way in?",
              '<details class="home-shortcuts">',
          ):
              if marker not in home:
                  raise SystemExit(f"Home missing V2.3 marker {marker!r}")

          if home.count("choice-card home-start-card") != 4:
              raise SystemExit("Home does not expose exactly four primary start cards")
          if home.count("choice-card home-need-card") != 8:
              raise SystemExit("Home does not expose exactly eight need-area cards")
          if '<details class="home-shortcuts" open' in home:
              raise SystemExit("Home compatibility shortcuts unexpectedly open by default")

          for marker in (
              "Choose an area of life",
              "Other ways to browse",
              '<details class="needs-complete-index">',
              "Show all 175 governed Questions",
          ):
              if marker not in needs:
                  raise SystemExit(f"/needs/ missing V2.3 marker {marker!r}")

          if needs.count("choice-card need-index-card") != 8:
              raise SystemExit("/needs/ does not expose exactly eight area cards")
          if '<details class="needs-complete-index" open' in needs:
              raise SystemExit("/needs/ complete-question compatibility index unexpectedly open")
          if needs.count('href="/questions/') < 175:
              raise SystemExit("/needs/ no longer preserves all 175 governed Question links")

          for label, page, expected_page_class, expected_hub_class in (
              ("communication", communication, "page--need-communication", "need-hub--communication"),
              ("health", health, "page--need-health", "need-hub--health"),
          ):
              if expected_page_class not in page:
                  raise SystemExit(f"{label}: missing persistent page tone class {expected_page_class}")
              if expected_hub_class not in page:
                  raise SystemExit(f"{label}: missing persistent hub tone class {expected_hub_class}")
              if "Start here" not in page:
                  raise SystemExit(f"{label}: missing Start here landmark")
              if "Practical questions" not in page:
                  raise SystemExit(f"{label}: missing practical-questions landmark")
              if "More context when you want it" not in page:
                  raise SystemExit(f"{label}: missing secondary-context landmark")
              if page.count('<details class="need-disclosure') != 3:
                  raise SystemExit(f"{label}: expected exactly three need disclosures")
              if '<details class="need-disclosure need-disclosure--questions" open' in page:
                  raise SystemExit(f"{label}: practical Questions unexpectedly open by default")

          if "white-space: normal" not in css or "overflow-wrap: anywhere" not in css:
              raise SystemExit("Live CSS missing narrow recovery-link wrapping fix")
          for marker in (
              ".page--need-communication",
              ".page--need-health",
              ".home-start-card--find",
              ".home-start-card--questions",
              ".home-start-card--resources",
              ".home-start-card--topics",
              "@media (forced-colors: active)",
          ):
              if marker not in css:
                  raise SystemExit(f"Live CSS missing V2.3 marker {marker!r}")

          measure = """<script>
          window.addEventListener("load", () => {
            document.body.dataset.scrollWidth = String(document.documentElement.scrollWidth);
            document.body.dataset.clientWidth = String(document.documentElement.clientWidth);
          });
          </script>"""

          for path in (
              root / "index.html",
              root / "needs/index.html",
              root / "needs/communication/index.html",
              root / "needs/health-wellbeing/index.html",
          ):
              text = path.read_text(encoding="utf-8")
              path.write_text(text.replace("</body>", measure + "</body>", 1), encoding="utf-8")

          home_open = home.replace(
              '<details class="home-shortcuts">',
              '<details class="home-shortcuts" open>',
              1,
          )
          home_focus = """<style>
          .site-header,
          .site-footer,
          .page-heading,
          .home-start,
          .home-needs,
          .home-orientation,
          .home-compatibility > :not(.home-shortcuts) {
            display: none !important;
          }
          main { padding-top: 1rem !important; }
          .home-compatibility { margin: 0 !important; padding: 0 !important; border: 0 !important; }
          </style>"""
          target = root / "home-shortcuts-open"
          target.mkdir(parents=True, exist_ok=True)
          (target / "index.html").write_text(
              home_open.replace("</head>", home_focus + "</head>", 1),
              encoding="utf-8",
          )

          needs_open = needs.replace(
              '<details class="needs-complete-index">',
              '<details class="needs-complete-index" open>',
              1,
          )
          needs_focus = """<style>
          .site-header,
          .site-footer,
          .page-heading,
          .notice,
          .needs-overview,
          #needs-other-heading,
          .home-orientation,
          .home-compatibility > :not(.needs-complete-index) {
            display: none !important;
          }
          main { padding-top: 1rem !important; }
          .home-compatibility { margin: 0 !important; padding: 0 !important; border: 0 !important; }
          </style>"""
          target = root / "needs-complete-open"
          target.mkdir(parents=True, exist_ok=True)
          (target / "index.html").write_text(
              needs_open.replace("</head>", needs_focus + "</head>", 1),
              encoding="utf-8",
          )

          communication_open = communication.replace(
              '<details class="need-disclosure need-disclosure--questions">',
              '<details class="need-disclosure need-disclosure--questions" open>',
              1,
          )
          target = root / "communication-questions-open"
          target.mkdir(parents=True, exist_ok=True)
          (target / "index.html").write_text(communication_open, encoding="utf-8")

          manifest = {
              "contract": "ND-UX-V2.3-LIVE",
              "deployed_main_sha": "b165ebb88141a2ce4e0f92a1ca5b64537b6aae49",
              "origin": "https://ndoracle.org",
              "home_primary_choices": 4,
              "need_areas": 8,
              "governed_questions_preserved": 175,
              "desktop": "1440",
              "narrow": "390",
          }
          Path("live-evidence/manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("PASS static live V2.3 markers, disclosures and persistent need identity")
          PY

          python -m http.server 8765 --directory live-snapshot >/tmp/nd-v2-3-live-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1

          command -v google-chrome

          python - <<'PY'
          import re
          import subprocess

          routes = (
              "/",
              "/needs/",
              "/needs/communication/",
              "/needs/health-wellbeing/",
          )
          for width, height, label in ((390, 844, "narrow"), (1440, 1100, "desktop")):
              for route in routes:
                  html = subprocess.check_output(
                      [
                          "google-chrome", "--headless=new", "--no-sandbox", "--disable-gpu",
                          "--virtual-time-budget=1200", f"--window-size={width},{height}", "--dump-dom",
                          f"http://127.0.0.1:8765{route}",
                      ],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  )
                  sw = re.search(r'data-scroll-width="(\d+)"', html)
                  cw = re.search(r'data-client-width="(\d+)"', html)
                  if not sw or not cw:
                      raise SystemExit(f"{label} {route}: layout metrics missing")
                  if int(sw.group(1)) > int(cw.group(1)) + 1:
                      raise SystemExit(
                          f"{label} {route}: horizontal overflow {sw.group(1)} > {cw.group(1)}"
                      )
                  print(f"PASS {label} no-overflow {route}")
          PY

          capture() {
            local folder="$1"
            local width="$2"
            local height="$3"
            local name="$4"
            local route="$5"
            google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars               --run-all-compositor-stages-before-draw --virtual-time-budget=1500               --window-size="$width,$height"               --screenshot="live-evidence/$folder/$name.png"               "http://127.0.0.1:8765$route"
            test -s "live-evidence/$folder/$name.png"
          }

          for spec in             "home|/"             "needs-index|/needs/"             "communication|/needs/communication/"             "health|/needs/health-wellbeing/"             "communication-open|/communication-questions-open/"             "home-shortcuts-open|/home-shortcuts-open/"             "needs-complete-open|/needs-complete-open/"
          do
            name="${spec%%|*}"
            route="${spec#*}"
            if [[ "$name" == "home" ]]; then
              capture desktop 1440 5200 "$name" "$route"
              capture narrow 390 5000 "$name" "$route"
            elif [[ "$name" == "needs-index" ]]; then
              capture desktop 1440 4200 "$name" "$route"
              capture narrow 390 4200 "$name" "$route"
            elif [[ "$name" == "communication" || "$name" == "health" ]]; then
              capture desktop 1440 3000 "$name" "$route"
              capture narrow 390 3600 "$name" "$route"
            elif [[ "$name" == "communication-open" || "$name" == "home-shortcuts-open" ]]; then
              capture desktop 1440 3400 "$name" "$route"
              capture narrow 390 5200 "$name" "$route"
            else
              capture desktop 1440 4400 "$name" "$route"
              capture narrow 390 6200 "$name" "$route"
            fi
          done

          test "$(find live-evidence/desktop -name '*.png' | wc -l)" -eq 7
          test "$(find live-evidence/narrow -name '*.png' | wc -l)" -eq 7

      - name: Upload live V2.3 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nd-ux-v2-3-live-production-evidence
          path: live-evidence/
          if-no-files-found: error
          retention-days: 30
