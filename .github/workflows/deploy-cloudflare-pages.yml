name: Deploy Cloudflare Pages (manual)

run-name: Deploy ${{ inputs.release_sha }} to Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character SHA currently at protected main
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  guard:
    name: Verify exact protected main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release_sha: ${{ steps.verify.outputs.release_sha }}

    steps:
      - name: Refuse non-main, stale release, or unprotected deployment environment
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "Refusing non-manual execution." >&2
            exit 1
          fi

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Refusing dispatch from $GITHUB_REF; select main when running this workflow." >&2
            exit 1
          fi

          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_sha must be an exact lowercase 40-character Git commit SHA." >&2
            exit 1
          fi

          CURRENT_MAIN="$(python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/commits/main",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "nd-oracle-release-guard",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              print(json.load(response)["sha"])
          PY
          )"

          if [[ "$RELEASE_SHA" != "$CURRENT_MAIN" ]]; then
            echo "Refusing stale or non-main release: requested $RELEASE_SHA; current main is $CURRENT_MAIN." >&2
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          environment = "cloudflare-pages-production"
          encoded_environment = urllib.parse.quote(environment, safe="")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/environments/{encoded_environment}",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "nd-oracle-release-guard",
              },
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  raise SystemExit(
                      "cloudflare-pages-production must exist before dispatch; "
                      "refusing GitHub's implicit environment auto-creation path"
                  ) from exc
              raise

          if payload.get("name") != environment:
              raise SystemExit("Deployment environment identity mismatch")

          policy = payload.get("deployment_branch_policy") or {}
          if policy.get("protected_branches") is not True:
              raise SystemExit(
                  "cloudflare-pages-production must allow protected branches only"
              )
          if policy.get("custom_branch_policies") is not False:
              raise SystemExit(
                  "cloudflare-pages-production has an unexpected custom branch policy"
              )

          protection_rules = payload.get("protection_rules") or []
          if not any(rule.get("type") == "branch_policy" for rule in protection_rules):
              raise SystemExit(
                  "cloudflare-pages-production is missing its branch-policy protection rule"
              )

          print(
              "Verified pre-existing cloudflare-pages-production environment "
              "restricted to protected branches."
          )
          PY

          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "Authorised candidate is current main: $RELEASE_SHA"

  deploy:
    name: Direct Upload exact main
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: cloudflare-pages-production
    env:
      RELEASE_SHA: ${{ needs.guard.outputs.release_sha }}
      PROJECT_NAME: nd-oracle

    steps:
      - name: Check out exact release
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checked-out identity
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [[ "$ACTUAL_SHA" != "$RELEASE_SHA" ]]; then
            echo "Checkout identity mismatch: expected $RELEASE_SHA, got $ACTUAL_SHA." >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Refusing dirty checkout before validation." >&2
            git status --short >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependency
        run: python -m pip install --requirement requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q scripts tests

      - name: Validate knowledge objects
        run: python scripts/validate.py

      - name: Run regression tests
        run: python -m unittest discover -s tests

      - name: Build exact deployment artifact
        run: python scripts/build_site.py

      - name: Enforce static deployment boundary
        shell: bash
        run: |
          set -euo pipefail

          test -f dist/index.html
          test -f dist/styles.css
          test -f dist/_headers
          test -f dist/.nd-oracle-generated

          for forbidden in functions dist/_worker.js wrangler.toml wrangler.json wrangler.jsonc; do
            if [[ -e "$forbidden" ]]; then
              echo "Refusing broadened runtime/configuration surface: $forbidden exists." >&2
              exit 1
            fi
          done

          if find dist -type l -print -quit | grep -q .; then
            echo "Refusing deployment artifact containing symbolic links." >&2
            exit 1
          fi

      - name: Record artifact digest
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_SHA256="$(python - <<'PY'
          import hashlib
          from pathlib import Path

          root = Path("dist")
          digest = hashlib.sha256()
          files = sorted(path for path in root.rglob("*") if path.is_file())
          for path in files:
              relative = path.relative_to(root).as_posix().encode("utf-8")
              payload = path.read_bytes()
              digest.update(len(relative).to_bytes(8, "big"))
              digest.update(relative)
              digest.update(len(payload).to_bytes(8, "big"))
              digest.update(payload)
          print(digest.hexdigest())
          PY
          )"
          echo "Artifact SHA-256: $ARTIFACT_SHA256"
          {
            echo "### Cloudflare Pages release artifact"
            echo "- Release SHA: \`$RELEASE_SHA\`"
            echo "- Artifact SHA-256: \`$ARTIFACT_SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Verify pinned Wrangler
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(npx --yes wrangler@4.114.0 --version | tr -d '\r')"
          echo "Wrangler: $VERSION"
          if [[ "$VERSION" != *"4.114.0"* ]]; then
            echo "Refusing unexpected Wrangler version: $VERSION" >&2
            exit 1
          fi

      - name: Verify Cloudflare credentials and existing Direct Upload project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "Missing CLOUDFLARE_API_TOKEN secret." >&2
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "Missing CLOUDFLARE_ACCOUNT_ID secret." >&2
            exit 1
          fi

          PROJECT_JSON="$RUNNER_TEMP/cloudflare-pages-project.json"
          curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            > "$PROJECT_JSON"

          PROJECT_JSON="$PROJECT_JSON" python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["PROJECT_JSON"]).read_text(encoding="utf-8"))
          if payload.get("success") is not True:
              raise SystemExit("Cloudflare project lookup did not report success")
          project = payload.get("result") or {}
          if project.get("name") != "nd-oracle":
              raise SystemExit("Expected existing Cloudflare Pages project nd-oracle")
          if project.get("production_branch") != "main":
              raise SystemExit("Cloudflare Pages production_branch must be main")
          if project.get("source"):
              raise SystemExit("Refusing Git-integrated Pages project; Direct Upload project required")
          domains = [str(item).lower().rstrip(".") for item in (project.get("domains") or [])]
          blocked = [item for item in domains if item == "ndoracle.org" or item.endswith(".ndoracle.org")]
          if blocked:
              raise SystemExit("Refusing deployment while ndoracle.org is attached: " + ", ".join(blocked))
          print("Verified existing Direct Upload project with production branch main and no ndoracle.org custom domain.")
          PY

      - name: Recheck release and deploy to pages.dev only
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import urllib.request

          release = os.environ["RELEASE_SHA"]

          github_request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/commits/main",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "nd-oracle-release-guard",
              },
          )
          with urllib.request.urlopen(github_request, timeout=30) as response:
              current_main = json.load(response)["sha"]
          if current_main != release:
              raise SystemExit(f"main changed before deployment: expected {release}, now {current_main}")

          cloudflare_request = urllib.request.Request(
              f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CLOUDFLARE_ACCOUNT_ID']}/pages/projects/{os.environ['PROJECT_NAME']}",
              headers={
                  "Authorization": f"Bearer {os.environ['CLOUDFLARE_API_TOKEN']}",
                  "Content-Type": "application/json",
                  "User-Agent": "nd-oracle-release-guard",
              },
          )
          with urllib.request.urlopen(cloudflare_request, timeout=30) as response:
              payload = json.load(response)
          project = payload.get("result") or {}
          if payload.get("success") is not True or project.get("name") != "nd-oracle":
              raise SystemExit("Cloudflare project identity changed or lookup failed")
          if project.get("production_branch") != "main" or project.get("source"):
              raise SystemExit("Cloudflare project is no longer the expected Direct Upload/main configuration")
          domains = [str(item).lower().rstrip(".") for item in (project.get("domains") or [])]
          if any(item == "ndoracle.org" or item.endswith(".ndoracle.org") for item in domains):
              raise SystemExit("ndoracle.org became attached before deployment; refusing upload")
          PY

          npx --yes wrangler@4.114.0 pages deploy dist \
            --project-name="$PROJECT_NAME" \
            --branch=main \
            --commit-hash="$RELEASE_SHA" \
            --commit-dirty=false \
            --experimental-provision=false \
            --experimental-auto-create=false \
            --install-skills=false

          {
            echo "- Cloudflare Pages Direct Upload command completed for \`$RELEASE_SHA\`."
            echo "- Custom-domain and DNS mutation: not requested by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
